<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wettervorhersage Berlin</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; background: #f8fafc; color: #1e293b; max-width: 800px; margin: 40px auto; padding: 0 20px; }
    .card { background: white; padding: 24px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    h1 { text-align: center; font-size: 1.5rem; margin-bottom: 24px; }
    table { width: 100%; border-collapse: collapse; margin-top: 24px; }
    th, td { padding: 10px; text-align: center; border-bottom: 1px solid #e2e8f0; }
    th { background: #f1f5f9; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🌤️ 5-Tage Wettervorhersage Berlin</h1>
    <canvas id="chart" height="120"></canvas>
    <table>
      <thead>
        <tr><th>Datum</th><th>Max Temp</th><th>Min Temp</th><th>Niederschlag</th></tr>
      </thead>
      <tbody><tr><td>2026-10-15</td><td>16.4 °C</td><td>6.7 °C</td><td>0 mm</td></tr><tr><td>2026-10-16</td><td>18.1 °C</td><td>8.2 °C</td><td>0 mm</td></tr><tr><td>2026-10-17</td><td>13.6 °C</td><td>7.7 °C</td><td>0 mm</td></tr><tr><td>2026-10-18</td><td>14.3 °C</td><td>5.1 °C</td><td>0 mm</td></tr><tr><td>2026-10-19</td><td>10.6 °C</td><td>7.4 °C</td><td>0 mm</td></tr><tr><td>2026-10-20</td><td>16 °C</td><td>8.4 °C</td><td>0 mm</td></tr><tr><td>2026-10-21</td><td>17.2 °C</td><td>10.1 °C</td><td>0 mm</td></tr></tbody>
    </table>
  </div>
  <script>
    new Chart(document.getElementById('chart'), {
      type: 'line',
      data: {
        labels: ["2026-10-15","2026-10-16","2026-10-17","2026-10-18","2026-10-19","2026-10-20","2026-10-21"],
        datasets: [
          { label: 'Max Temp (°C)', data: [16.4,18.1,13.6,14.3,10.6,16,17.2], borderColor: '#ef4444', backgroundColor: 'rgba(239, 68, 68, 0.1)', fill: true, tension: 0.3 },
          { label: 'Min Temp (°C)', data: [6.7,8.2,7.7,5.1,7.4,8.4,10.1], borderColor: '#3b82f6', backgroundColor: 'rgba(59, 130, 246, 0.1)', fill: true, tension: 0.3 }
        ]
      }
    });
  </script>
</body>
</html>
