<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wettervorhersage Berlin</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; background: #f8fafc; color: #1e293b; max-width: 800px; margin: 40px auto; padding: 0 20px; }
    .card { background: white; padding: 24px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    h1 { text-align: center; font-size: 1.5rem; margin-bottom: 24px; }
    table { width: 100%; border-collapse: collapse; margin-top: 24px; }
    th, td { padding: 10px; text-align: center; border-bottom: 1px solid #e2e8f0; }
    th { background: #f1f5f9; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🌤️ 5-Tage Wettervorhersage Berlin</h1>
    <canvas id="chart" height="120"></canvas>
    <table>
      <thead>
        <tr><th>Datum</th><th>Max Temp</th><th>Min Temp</th><th>Niederschlag</th></tr>
      </thead>
      <tbody><tr><td>2026-08-26</td><td>24 °C</td><td>15 °C</td><td>0 mm</td></tr><tr><td>2026-08-27</td><td>26.9 °C</td><td>14.6 °C</td><td>0 mm</td></tr><tr><td>2026-08-28</td><td>23.2 °C</td><td>17.9 °C</td><td>6.2 mm</td></tr><tr><td>2026-08-29</td><td>23.4 °C</td><td>16.3 °C</td><td>2.4 mm</td></tr><tr><td>2026-08-30</td><td>26.3 °C</td><td>17.5 °C</td><td>0 mm</td></tr><tr><td>2026-08-31</td><td>24.9 °C</td><td>17.2 °C</td><td>2.4 mm</td></tr><tr><td>2026-09-01</td><td>20.6 °C</td><td>16 °C</td><td>0.9 mm</td></tr></tbody>
    </table>
  </div>
  <script>
    new Chart(document.getElementById('chart'), {
      type: 'line',
      data: {
        labels: ["2026-08-26","2026-08-27","2026-08-28","2026-08-29","2026-08-30","2026-08-31","2026-09-01"],
        datasets: [
          { label: 'Max Temp (°C)', data: [24,26.9,23.2,23.4,26.3,24.9,20.6], borderColor: '#ef4444', backgroundColor: 'rgba(239, 68, 68, 0.1)', fill: true, tension: 0.3 },
          { label: 'Min Temp (°C)', data: [15,14.6,17.9,16.3,17.5,17.2,16], borderColor: '#3b82f6', backgroundColor: 'rgba(59, 130, 246, 0.1)', fill: true, tension: 0.3 }
        ]
      }
    });
  </script>
</body>
</html>
