<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wettervorhersage Berlin</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; background: #f8fafc; color: #1e293b; max-width: 800px; margin: 40px auto; padding: 0 20px; }
    .card { background: white; padding: 24px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    h1 { text-align: center; font-size: 1.5rem; margin-bottom: 24px; }
    table { width: 100%; border-collapse: collapse; margin-top: 24px; }
    th, td { padding: 10px; text-align: center; border-bottom: 1px solid #e2e8f0; }
    th { background: #f1f5f9; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🌤️ 5-Tage Wettervorhersage Berlin</h1>
    <canvas id="chart" height="120"></canvas>
    <table>
      <thead>
        <tr><th>Datum</th><th>Max Temp</th><th>Min Temp</th><th>Niederschlag</th></tr>
      </thead>
      <tbody><tr><td>2026-10-17</td><td>12.6 °C</td><td>9.4 °C</td><td>1.2 mm</td></tr><tr><td>2026-10-18</td><td>14.6 °C</td><td>11.3 °C</td><td>0 mm</td></tr><tr><td>2026-10-19</td><td>12.3 °C</td><td>3.2 °C</td><td>0 mm</td></tr><tr><td>2026-10-20</td><td>10.4 °C</td><td>1.8 °C</td><td>0 mm</td></tr><tr><td>2026-10-21</td><td>12.8 °C</td><td>7.5 °C</td><td>0 mm</td></tr><tr><td>2026-10-22</td><td>15.3 °C</td><td>7.2 °C</td><td>0.9 mm</td></tr><tr><td>2026-10-23</td><td>14.9 °C</td><td>5.8 °C</td><td>0 mm</td></tr></tbody>
    </table>
  </div>
  <script>
    new Chart(document.getElementById('chart'), {
      type: 'line',
      data: {
        labels: ["2026-10-17","2026-10-18","2026-10-19","2026-10-20","2026-10-21","2026-10-22","2026-10-23"],
        datasets: [
          { label: 'Max Temp (°C)', data: [12.6,14.6,12.3,10.4,12.8,15.3,14.9], borderColor: '#ef4444', backgroundColor: 'rgba(239, 68, 68, 0.1)', fill: true, tension: 0.3 },
          { label: 'Min Temp (°C)', data: [9.4,11.3,3.2,1.8,7.5,7.2,5.8], borderColor: '#3b82f6', backgroundColor: 'rgba(59, 130, 246, 0.1)', fill: true, tension: 0.3 }
        ]
      }
    });
  </script>
</body>
</html>
