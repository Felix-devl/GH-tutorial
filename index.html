<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wettervorhersage Berlin</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; background: #f8fafc; color: #1e293b; max-width: 800px; margin: 40px auto; padding: 0 20px; }
    .card { background: white; padding: 24px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    h1 { text-align: center; font-size: 1.5rem; margin-bottom: 24px; }
    table { width: 100%; border-collapse: collapse; margin-top: 24px; }
    th, td { padding: 10px; text-align: center; border-bottom: 1px solid #e2e8f0; }
    th { background: #f1f5f9; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🌤️ 5-Tage Wettervorhersage Berlin</h1>
    <canvas id="chart" height="120"></canvas>
    <table>
      <thead>
        <tr><th>Datum</th><th>Max Temp</th><th>Min Temp</th><th>Niederschlag</th></tr>
      </thead>
      <tbody><tr><td>2026-10-09</td><td>13.4 °C</td><td>9.4 °C</td><td>3 mm</td></tr><tr><td>2026-10-10</td><td>16.7 °C</td><td>11.6 °C</td><td>2.9 mm</td></tr><tr><td>2026-10-11</td><td>11.9 °C</td><td>8.4 °C</td><td>3.32 mm</td></tr><tr><td>2026-10-12</td><td>13.2 °C</td><td>7.7 °C</td><td>0 mm</td></tr><tr><td>2026-10-13</td><td>14.2 °C</td><td>1.5 °C</td><td>0.3 mm</td></tr><tr><td>2026-10-14</td><td>16.2 °C</td><td>10.2 °C</td><td>1.8 mm</td></tr><tr><td>2026-10-15</td><td>19.1 °C</td><td>11 °C</td><td>0 mm</td></tr></tbody>
    </table>
  </div>
  <script>
    new Chart(document.getElementById('chart'), {
      type: 'line',
      data: {
        labels: ["2026-10-09","2026-10-10","2026-10-11","2026-10-12","2026-10-13","2026-10-14","2026-10-15"],
        datasets: [
          { label: 'Max Temp (°C)', data: [13.4,16.7,11.9,13.2,14.2,16.2,19.1], borderColor: '#ef4444', backgroundColor: 'rgba(239, 68, 68, 0.1)', fill: true, tension: 0.3 },
          { label: 'Min Temp (°C)', data: [9.4,11.6,8.4,7.7,1.5,10.2,11], borderColor: '#3b82f6', backgroundColor: 'rgba(59, 130, 246, 0.1)', fill: true, tension: 0.3 }
        ]
      }
    });
  </script>
</body>
</html>
