<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wettervorhersage Berlin</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; background: #f8fafc; color: #1e293b; max-width: 800px; margin: 40px auto; padding: 0 20px; }
    .card { background: white; padding: 24px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    h1 { text-align: center; font-size: 1.5rem; margin-bottom: 24px; }
    table { width: 100%; border-collapse: collapse; margin-top: 24px; }
    th, td { padding: 10px; text-align: center; border-bottom: 1px solid #e2e8f0; }
    th { background: #f1f5f9; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🌤️ 5-Tage Wettervorhersage Berlin</h1>
    <canvas id="chart" height="120"></canvas>
    <table>
      <thead>
        <tr><th>Datum</th><th>Max Temp</th><th>Min Temp</th><th>Niederschlag</th></tr>
      </thead>
      <tbody><tr><td>2026-09-05</td><td>20.4 °C</td><td>15 °C</td><td>0 mm</td></tr><tr><td>2026-09-06</td><td>20.7 °C</td><td>12.2 °C</td><td>0 mm</td></tr><tr><td>2026-09-07</td><td>25.2 °C</td><td>12.8 °C</td><td>0 mm</td></tr><tr><td>2026-09-08</td><td>23.5 °C</td><td>17.8 °C</td><td>0 mm</td></tr><tr><td>2026-09-09</td><td>19.7 °C</td><td>14.6 °C</td><td>0 mm</td></tr><tr><td>2026-09-10</td><td>18.6 °C</td><td>11.9 °C</td><td>0 mm</td></tr><tr><td>2026-09-11</td><td>19.2 °C</td><td>10.5 °C</td><td>4.2 mm</td></tr></tbody>
    </table>
  </div>
  <script>
    new Chart(document.getElementById('chart'), {
      type: 'line',
      data: {
        labels: ["2026-09-05","2026-09-06","2026-09-07","2026-09-08","2026-09-09","2026-09-10","2026-09-11"],
        datasets: [
          { label: 'Max Temp (°C)', data: [20.4,20.7,25.2,23.5,19.7,18.6,19.2], borderColor: '#ef4444', backgroundColor: 'rgba(239, 68, 68, 0.1)', fill: true, tension: 0.3 },
          { label: 'Min Temp (°C)', data: [15,12.2,12.8,17.8,14.6,11.9,10.5], borderColor: '#3b82f6', backgroundColor: 'rgba(59, 130, 246, 0.1)', fill: true, tension: 0.3 }
        ]
      }
    });
  </script>
</body>
</html>
